name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Factory Leave APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull Buildozer Docker image
        run: docker pull ghcr.io/kivy/buildozer:1.2.0

      - name: Build APK
        run: |
          mkdir -p "$HOME/.buildozer"
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/home/user/hostcwd \
            -v "$HOME/.buildozer":/home/user/.buildozer \
            ghcr.io/kivy/buildozer:1.2.0 \
            android debug

      - name: Find APK
        run: |
          echo "APK files:"
          find bin -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Factory-Leave-APK
          path: bin/*.apk
